<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Issue Manager</title>
<style>
  :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column; }
  [hidden] { display: none !important; }
  header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px; border-bottom: 1px solid GrayText; }
  #scope { width: 22em; max-width: 100%; }
  #status { margin-left: auto; }
  #nav { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 6px 8px; border-bottom: 1px solid GrayText; }
  #nav:empty { display: none; }
  #board { flex: 1; min-height: 0; display: flex; gap: 8px; align-items: flex-start; padding: 8px; overflow-x: auto; }
  .col { flex: 0 0 280px; max-height: 100%; overflow-y: auto; box-sizing: border-box; border: 1px solid GrayText; border-radius: 6px; padding: 6px; }
  .col.over { outline: 2px solid Highlight; }
  .col h2 { font-size: 14px; margin: 0 0 6px; }
  .tools { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
  .cards { display: flex; flex-direction: column; gap: 4px; min-height: 60px; }
  .card { display: block; padding: 6px; border: 1px solid GrayText; border-radius: 4px; cursor: grab; }
  .card:has(:checked) { outline: 2px solid Highlight; }
  .meta { font-size: 12px; opacity: .7; }
  dialog { width: min(480px, 90vw); }
  dialog label { display: block; margin: 8px 0; }
  dialog label > :not([type=checkbox]) { display: block; width: 100%; box-sizing: border-box; }
  .sw { display: inline-block; width: 1em; height: 1em; border-radius: 3px; vertical-align: middle; }
</style>
<header>
  <form id="pick">
    <input id="scope" list="scopes" placeholder="group or group/project" aria-label="Group or project" required>
    <datalist id="scopes"></datalist>
    <button>Load</button>
  </form>
  <button id="newMs">+ Milestone</button>
  <button id="labels">Labels</button>
  <button id="bulk">Edit selected</button>
  <input id="filter" type="search" placeholder="Filter issues" aria-label="Filter issues">
  <span id="status" role="status"></span>
  <button id="signout">Sign out</button>
</header>
<nav id="nav" aria-label="Groups and projects"></nav>
<main id="board"></main>
<dialog id="dlg"><form method="dialog">
  <h3></h3><div class="fields"></div>
  <button>Save</button> <button type="button" onclick="this.closest('dialog').close()">Cancel</button>
</form></dialog>
<dialog id="labelsDlg">
  <h3>Labels</h3>
  <div id="labelList"></div>
  <form method="dialog"><button>Close</button></form>
</dialog>
<script>
// Edit these, then deploy.
const GITLAB = 'https://gitlab.com'; // or your self-managed URL (GitLab 15.1+ for browser SSO)
const CLIENT_ID = ''; // OAuth application ID (non-confidential, scope: api)
const GROUPS = []; // groups to manage, e.g. ['my-group', 'other/sub']; empty = every group you're a member of

const REDIRECT = location.origin + location.pathname;
const $ = id => document.getElementById(id);
const setStatus = t => $('status').textContent = t;
const run = fn => async (...a) => { try { await fn(...a); } catch (e) { setStatus(e.message); } };
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const sha256 = s => crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
const kinds = new Map(); // full path -> 'groups' | 'projects'
let cur; // { kind, path, base }
let inherit = 'include_ancestors'; // milestones from parent groups; 'include_parent_milestones' before GitLab 16.7

// --- OAuth (authorization code + PKCE, no backend) ---
async function login() {
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(16)));
  sessionStorage.pkce = JSON.stringify({ verifier, state });
  location = GITLAB + '/oauth/authorize?' + new URLSearchParams({
    client_id: CLIENT_ID, redirect_uri: REDIRECT, response_type: 'code', scope: 'api', state,
    code_challenge: b64url(await sha256(verifier)), code_challenge_method: 'S256',
  });
}

async function token() {
  const q = new URLSearchParams(location.search);
  if (q.get('error')) throw Error(q.get('error_description') || q.get('error'));
  if (q.has('code')) {
    const { verifier, state } = JSON.parse(sessionStorage.pkce || '{}');
    sessionStorage.removeItem('pkce');
    history.replaceState(null, '', REDIRECT);
    if (!state || q.get('state') !== state) throw Error('OAuth state mismatch, reload to retry');
    const r = await fetch(GITLAB + '/oauth/token', { method: 'POST', body: new URLSearchParams({
      client_id: CLIENT_ID, code: q.get('code'), grant_type: 'authorization_code', redirect_uri: REDIRECT, code_verifier: verifier,
    }) });
    if (!r.ok) throw Error('Token exchange failed: ' + r.status);
    sessionStorage.token = (await r.json()).access_token;
  }
  return sessionStorage.token;
}

// ponytail: token expires after 2h and we just re-run SSO; use refresh_token if the redirect bothers you.
async function api(path, opts = {}) {
  const r = await fetch(GITLAB + (path.startsWith('/api/') ? path : '/api/v4' + path), { ...opts, headers: {
    Authorization: 'Bearer ' + sessionStorage.token, ...(opts.body && { 'Content-Type': 'application/json' }),
  } });
  if (r.status === 401) { sessionStorage.removeItem('token'); login(); throw Error('Session expired, signing in…'); }
  if (!r.ok) throw Error(`${r.status} ${(await r.json().catch(() => ({}))).message ?? path}`);
  return r;
}

async function all(path) {
  const out = [];
  for (let page = '1'; page; ) {
    const r = await api(`${path}${path.includes('?') ? '&' : '?'}per_page=100&page=${page}`);
    out.push(...await r.json());
    page = r.headers.get('x-next-page');
  }
  return out;
}

// Issue start dates only exist on work items (GraphQL); due dates stay on REST so they work everywhere.
async function gql(query, variables) {
  const j = await (await api('/api/graphql', { method: 'POST', body: JSON.stringify({ query, variables }) })).json();
  const err = j.errors?.[0]?.message ?? Object.values(j.data ?? {})[0]?.errors?.[0];
  if (err) throw Error(err);
  return j.data;
}
const wid = i => `gid://gitlab/WorkItem/${i.id}`;
const getStart = i => gql('query($id: WorkItemID!) { workItem(id: $id) { widgets { ... on WorkItemWidgetStartAndDueDate { startDate } } } }', { id: wid(i) })
  .then(d => d.workItem?.widgets.find(w => 'startDate' in w)).then(w => w ? w.startDate : undefined, () => undefined); // undefined: no start dates here
const setDates = (i, s, d) => gql('mutation($id: WorkItemID!, $s: Date, $d: Date) { workItemUpdate(input: { id: $id, startAndDueDateWidget: { startDate: $s, dueDate: $d } }) { errors } }', { id: wid(i), s, d });

// --- Board: one column per milestone, drag issues between them ---
const msPath = m => m.project_id ? `/projects/${m.project_id}/milestones/${m.id}` : `/groups/${m.group_id}/milestones/${m.id}`;
const selected = () => [...$('board').querySelectorAll('.card input:checked')].map(i => i.closest('.card'));
const recount = () => $('board').querySelectorAll('.col').forEach(c => c.querySelector('.n').textContent = c.querySelectorAll('.card:not([hidden])').length);

// --- Edit dialogs ---
// fields: [name, label, type, value, options?]; first field is required. Resolves to {name: value} or false on cancel.
function ask(heading, fields) {
  const d = $('dlg'), form = d.querySelector('form');
  d.querySelector('h3').textContent = heading;
  d.querySelector('.fields').replaceChildren(...fields.map(([name, label, type, value, options], idx) => el('label', {}, label,
    type === 'textarea' ? el('textarea', { name, rows: 6, value: value ?? '' })
    : type === 'select' ? el('select', { name, multiple: true, size: 6 }, ...options.map(([v, t]) => el('option', { value: v, selected: value.includes(v) }, t)))
    : el('input', { name, type, required: idx === 0, ...(type === 'checkbox' ? { checked: !!value } : { value: value ?? '' }) }))));
  d.showModal();
  return new Promise(res => {
    form.onsubmit = () => res(Object.fromEntries(fields.map(([name, , type]) => {
      const x = form.elements[name];
      return [name, type === 'select' ? [...x.selectedOptions].map(o => o.value) : type === 'checkbox' ? x.checked : type === 'date' ? x.value || null : x.value];
    })));
    d.onclose = () => d.open || res(false); // close is async: ignore a stale one arriving after the next ask() reopened
  });
}

const meta = new Map(); // project id -> Promise<[labels, members]>, for the issue editor
const projectMeta = pid => meta.get(pid) ?? meta.set(pid, Promise.all([all(`/projects/${pid}/labels`), all(`/projects/${pid}/members/all`)])
  .catch(e => { meta.delete(pid); throw e; })).get(pid);

async function editIssue(c) {
  const i = c.issue, [[labels, members], start] = await Promise.all([projectMeta(i.project_id), getStart(i)]);
  const v = await ask(`Edit ${i.references.relative}`, [
    ['title', 'Title', 'text', i.title],
    ['description', 'Description', 'textarea', i.description],
    ['labels', 'Labels', 'select', i.labels, [...new Set([...i.labels, ...labels.map(l => l.name)])].map(n => [n, n])],
    ['assignee_ids', 'Assignees', 'select', i.assignees.map(a => String(a.id)),
      [...new Map([...i.assignees, ...members].map(m => [String(m.id), `${m.name} (@${m.username})`]))]],
    ...(start === undefined ? [] : [['start_date', 'Start date', 'date', start]]),
    ['due_date', 'Due date', 'date', i.due_date],
    ['close', 'Close issue', 'checkbox', false],
  ]);
  if (!v) return;
  const { close, start_date, ...body } = v;
  const r = await api(`/projects/${i.project_id}/issues/${i.iid}`, { method: 'PUT', body: JSON.stringify({
    ...body, labels: body.labels.join(','), assignee_ids: body.assignee_ids.map(Number), state_event: close ? 'close' : undefined,
  }) });
  if (start_date !== undefined && start_date !== start) await setDates(i, start_date, body.due_date);
  close ? c.remove() : c.replaceWith(card(await r.json()));
  $('filter').oninput();
  setStatus(close ? 'Issue closed' : 'Issue saved');
}

async function saveMs(m) {
  if (!cur) throw Error('Load a group or project first');
  const v = await ask(m ? `Edit milestone ${m.title}` : 'New milestone', [
    ['title', 'Title', 'text', m?.title],
    ['description', 'Description', 'textarea', m?.description],
    ['start_date', 'Start date', 'date', m?.start_date],
    ['due_date', 'Due date', 'date', m?.due_date],
  ]);
  if (!v) return;
  await api(m ? msPath(m) : cur.base + '/milestones', { method: m ? 'PUT' : 'POST', body: JSON.stringify(v) });
  load();
}

async function showLabels() {
  if (!cur) throw Error('Load a group or project first');
  const parts = cur.path.split('/');
  const levels = parts.map((_, n) => [parts.slice(0, n + 1).join('/'), n === parts.length - 1 ? cur.kind : 'groups']);
  const lists = await Promise.all(levels.map(([p, k]) => all(`/${k}/${encodeURIComponent(p)}/labels?include_ancestor_groups=false`).catch(() => null))); // null: no access
  $('labelList').replaceChildren(...levels.flatMap(([p, k], n) => {
    if (!lists[n]) return [];
    const base = `/${k}/${encodeURIComponent(p)}`;
    return [
      el('h4', {}, `${p} (${k.slice(0, -1)}) `, el('button', { textContent: '+ Label', onclick: run(() => saveLabel(base, null)) }), ' ',
        el('button', { textContent: 'Copy all to…', onclick: run(() => copyLabels(lists[n], p)) })),
      el('ul', {}, ...lists[n].map(l => {
        const sw = el('span', { className: 'sw' });
        sw.style.background = l.color;
        return el('li', {}, sw, ' ', l.name, l.description ? ` — ${l.description}` : '', ' ',
          el('button', { textContent: 'Edit', onclick: run(() => saveLabel(base, l)) }), ' ',
          el('button', { textContent: 'Copy to…', onclick: run(() => copyLabels([l], p)) }));
      })),
    ];
  }));
  if (!$('labelsDlg').open) $('labelsDlg').showModal();
}

async function saveLabel(base, l) {
  const v = await ask(l ? `Edit label ${l.name}` : 'New label', [
    ['name', 'Name', 'text', l?.name],
    ['color', 'Color', 'color', l?.color ?? '#428bca'],
    ['description', 'Description', 'text', l?.description],
  ]);
  if (!v) return;
  await api(l ? `${base}/labels/${l.id}` : base + '/labels', { method: l ? 'PUT' : 'POST',
    body: JSON.stringify(l ? { new_name: v.name !== l.name ? v.name : undefined, color: v.color, description: v.description } : v) });
  meta.clear();
  await showLabels();
  load();
}

// GitLab can't share a label across unrelated groups, so "apply" = create (or update) a same-named label there.
async function copyLabels(labels, from) {
  if (!labels.length) throw Error('No labels to copy');
  const v = await ask(`Copy ${labels.length === 1 ? `"${labels[0].name}"` : `${labels.length} labels`} from ${from}`, [
    ['to', 'To (a label with the same name gets its colour and description updated)', 'select', [],
      [...kinds].filter(([p]) => p !== from).sort().map(([p, k]) => [p, `${p} (${k.slice(0, -1)})`])],
  ]);
  if (!v?.to.length) return;
  const jobs = v.to.flatMap(p => labels.map(l => [`/${kinds.get(p)}/${encodeURIComponent(p)}/labels`, l]));
  setStatus(`Copying ${jobs.length}…`);
  const res = await Promise.allSettled(jobs.map(([base, { name, color, description }]) =>
    api(base, { method: 'POST', body: JSON.stringify({ name, color, description }) }).catch(e => e.message.startsWith('409')
      ? api(`${base}/${encodeURIComponent(name)}`, { method: 'PUT', body: JSON.stringify({ color, description }) }) : Promise.reject(e))));
  meta.clear();
  await showLabels();
  const bad = res.filter(r => r.status === 'rejected');
  setStatus(bad.length ? `${bad.length} of ${jobs.length} failed: ${bad[0].reason.message}` : `Copied ${jobs.length}`);
}

async function bulkEdit() {
  const cards = selected();
  if (!cards.length) throw Error('Tick some issues first');
  const opts = [...new Set((await all(cur.base + '/labels?include_ancestor_groups=true')).map(l => l.name))].map(n => [n, n]);
  const v = await ask(`Edit ${cards.length} selected issues (blank = unchanged)`, [
    ['add_labels', 'Add labels', 'select', [], opts],
    ['remove_labels', 'Remove labels', 'select', [], opts],
    ['start_date', 'Start date', 'date', null],
    ['due_date', 'Due date', 'date', null],
  ]);
  if (!v) return;
  const body = { add_labels: v.add_labels.join(',') || undefined, remove_labels: v.remove_labels.join(',') || undefined, due_date: v.due_date ?? undefined };
  setStatus(`Saving ${cards.length}…`);
  const res = await Promise.allSettled(cards.map(async c => {
    let i = c.issue;
    if (Object.values(body).some(x => x)) i = await (await api(`/projects/${i.project_id}/issues/${i.iid}`, { method: 'PUT', body: JSON.stringify(body) })).json();
    if (v.start_date) await setDates(i, v.start_date, i.due_date);
    c.replaceWith(card(i));
  }));
  $('filter').oninput();
  const bad = res.filter(r => r.status === 'rejected');
  setStatus(bad.length ? `${bad.length} failed (still ticked): ${bad[0].reason.message}` : `Updated ${cards.length}`);
}

function card(i) {
  const c = el('label', { className: 'card', draggable: true, issue: i },
    el('input', { type: 'checkbox' }), ' ',
    el('button', { textContent: '✎', title: 'Edit issue', ariaLabel: 'Edit issue', onclick: run(e => { e.preventDefault(); return editIssue(c); }) }), ' ',
    el('a', { href: i.web_url, target: '_blank', rel: 'noopener' }, i.references.relative), ' ', i.title,
    el('div', { className: 'meta' }, [...i.labels, ...i.assignees.map(a => '@' + a.username), i.due_date && 'due ' + i.due_date].filter(Boolean).join(' · ')));
  c.ondragstart = e => {
    if (!c.firstChild.checked) { selected().forEach(s => s.firstChild.checked = false); c.firstChild.checked = true; }
    e.dataTransfer.setData('text/plain', i.web_url);
  };
  return c;
}

async function move(m, list) {
  const cards = selected().filter(c => c.parentNode !== list);
  setStatus(`Moving ${cards.length}…`);
  const res = await Promise.allSettled(cards.map(async c => {
    const from = c.parentNode;
    list.append(c); c.firstChild.checked = false;
    try {
      await api(`/projects/${c.issue.project_id}/issues/${c.issue.iid}`, { method: 'PUT', body: JSON.stringify({ milestone_id: m ? m.id : 0 }) });
    } catch (e) { from.append(c); throw e; }
  }));
  recount();
  const bad = res.filter(r => r.status === 'rejected');
  setStatus(bad.length ? `${bad.length} failed: ${bad[0].reason.message}` : `Moved ${cards.length}`);
}

function column(m) {
  const list = el('div', { className: 'cards' });
  const col = el('section', { className: 'col' },
    el('h2', {}, m ? el('a', { href: m.web_url, target: '_blank', rel: 'noopener' }, m.title) : 'No milestone',
      m?.state === 'closed' ? ' (closed)' : '', ' · ', el('span', { className: 'n' })),
    el('div', { className: 'tools' },
      el('button', { textContent: 'Move selected here', onclick: run(() => move(m, list)) }),
      ...(m ? [
        el('button', { textContent: 'Edit', onclick: run(() => saveMs(m)) }),
        m.start_date || m.due_date ? ` ${m.start_date ?? '…'} → ${m.due_date ?? '…'}` : '',
        el('button', { textContent: m.state === 'closed' ? 'Reopen' : 'Close', onclick: run(async () => {
          if (!confirm(`${m.state === 'closed' ? 'Reopen' : 'Close'} milestone "${m.title}"?`)) return;
          await api(msPath(m), { method: 'PUT', body: JSON.stringify({ state_event: m.state === 'closed' ? 'activate' : 'close' }) });
          load();
        }) }),
      ] : [])),
    list);
  col.ondragover = e => { e.preventDefault(); col.classList.add('over'); };
  col.ondragleave = e => col.contains(e.relatedTarget) || col.classList.remove('over');
  col.ondrop = run(e => { e.preventDefault(); col.classList.remove('over'); return move(m, list); });
  return { col, list };
}

// --- Drill-down nav: breadcrumb up, subgroups/projects down ---
const parentOf = p => p.split('/').slice(0, -1).join('/');
async function resolve(p) {
  if (!p || kinds.has(p)) return kinds.get(p);
  for (const k of ['groups', 'projects'])
    if (await api(`/${k}/${encodeURIComponent(p)}${k === 'groups' ? '?with_projects=false' : ''}`).then(() => true, () => false)) return kinds.set(p, k).get(p);
}
const go = p => { $('scope').value = p; load(); };
const fillList = () => $('scopes').replaceChildren(...[...kinds].map(([v, k]) => el('option', { value: v, label: k.slice(0, -1) })));

function nav(path, children) {
  const parts = path ? path.split('/') : [];
  $('nav').replaceChildren(
    path ? el('button', { textContent: 'All groups', onclick: () => go('') }) : el('b', {}, 'All groups'),
    ...parts.flatMap((p, i) => {
      const pre = parts.slice(0, i + 1).join('/');
      return [' / ', pre !== path ? el('button', { textContent: p, onclick: () => go(pre) }) : el('b', {}, p)];
    }),
    children.length ? ' → ' : '',
    ...children.sort(([a, x], [b, y]) => x.localeCompare(y) || a.localeCompare(b))
      .map(([p, k]) => el('button', { textContent: (k === 'groups' ? '📁 ' : '') + p.slice(path ? path.length + 1 : 0), onclick: () => go(p) })));
}

const load = run(async () => {
  const path = $('scope').value.trim(), kind = await resolve(path);
  if (!kind) { // top level: every group whose parent you can't see
    localStorage.scope = cur = '';
    $('board').replaceChildren();
    nav('', GROUPS.length ? GROUPS.map(g => [g, 'groups']) : [...kinds].filter(([p, k]) => k === 'groups' && kinds.get(parentOf(p)) !== 'groups'));
    return setStatus(path ? `"${path}" isn't one of your groups or projects` : 'Pick a group');
  }
  localStorage.scope = path;
  cur = { kind, path, base: `/${kind}/${encodeURIComponent(path)}` };
  setStatus('Loading…');
  const [ms, issues, subgroups, projects] = await Promise.all([
    all(`${cur.base}/milestones?state=active&${inherit}=true`),
    all(cur.base + '/issues?state=opened'),
    kind === 'groups' ? all(cur.base + '/subgroups') : [],
    kind === 'groups' ? all(cur.base + '/projects?archived=false&simple=true') : [],
  ]);
  const children = [...subgroups.map(g => [g.full_path, 'groups']), ...projects.map(p => [p.path_with_namespace, 'projects'])];
  children.forEach(([p, k]) => kinds.set(p, k));
  fillList();
  nav(path, children);
  ms.sort((a, b) => (a.due_date || '9999').localeCompare(b.due_date || '9999') || a.title.localeCompare(b.title));
  const cols = new Map([[0, column(null)], ...ms.map(m => [m.id, column(m)])]);
  for (const i of issues) {
    const id = i.milestone?.id ?? 0; // closed/foreign milestones still holding open issues get their own column
    if (!cols.has(id)) cols.set(id, column(i.milestone));
    cols.get(id).list.append(card(i));
  }
  $('board').replaceChildren(...[...cols.values()].map(c => c.col));
  $('filter').oninput();
  setStatus(`${issues.length} open issues, ${ms.length} milestones`);
});

$('pick').onsubmit = e => { e.preventDefault(); load(); };
$('filter').oninput = () => {
  const q = $('filter').value.toLowerCase();
  $('board').querySelectorAll('.card').forEach(c => c.hidden = !c.textContent.toLowerCase().includes(q));
  recount();
};
$('newMs').onclick = run(() => saveMs(null));
$('labels').onclick = run(showLabels);
$('bulk').onclick = run(bulkEdit);
$('signout').onclick = () => {
  fetch(GITLAB + '/oauth/revoke', { method: 'POST', body: new URLSearchParams({ client_id: CLIENT_ID, token: sessionStorage.token || '' }) }).catch(() => {});
  sessionStorage.clear(); $('board').replaceChildren(); setStatus('Signed out. Reload to sign in.');
};

(async () => {
  if (location.hash === '#selftest') { // PKCE S256 encoding: covers '-', '_' and padding strip
    const ok = b64url(await sha256('abc')) === 'ungWv48Bz-pBQUDeXa4iI7ADYaOWF3qctBD_YfIAFa0';
    return setStatus(ok ? 'selftest ok' : 'selftest FAILED');
  }
  if (!CLIENT_ID) return setStatus('Set CLIENT_ID in index.html');
  try {
    if (!await token()) return login();
    setStatus('Loading groups and projects…');
    const [{ version }, groups, projects] = await Promise.all([
      api('/version').then(r => r.json()),
      GROUPS.length ? GROUPS.map(full_path => ({ full_path })) : all('/groups?min_access_level=20'),
      GROUPS.length ? [] : all('/projects?membership=true&simple=true&archived=false&min_access_level=20'),
    ]);
    const [major, minor] = version.split('.').map(Number);
    if (major < 16 || (major === 16 && minor < 7)) inherit = 'include_parent_milestones';
    groups.forEach(g => kinds.set(g.full_path, 'groups'));
    projects.forEach(p => kinds.set(p.path_with_namespace, 'projects'));
    fillList();
    go(localStorage.scope || '');
  } catch (e) { setStatus(e.message); }
})();
</script>
